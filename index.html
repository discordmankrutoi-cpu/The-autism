
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Moto - Полная версия</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; touch-action: none; color: white; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="g"></canvas>
<script>
const cvs = document.getElementById('g');
const ctx = cvs.getContext('2d');
let st = 'MENU', coins = 0;
let unlocked = ['РЫЖИЙ'];
let currentSkin = 'РЫЖИЙ';
let roadY = 0, obs = [], p = { l: 1, x: 0, tx: 0, tilt: 0, respawn: true };

const SKINS = [
    { n: 'РЫЖИЙ', p: 0, c: '#e67e22' },
    { n: 'МИЛАШКА', p: 2200, c: '#ff9ff3' },
    { n: 'КОСМО', p: 10000, c: '#5f27cd' },
    { n: 'ХЕЛЛОУИН', p: 25000, c: '#ff9f43' }
];

function resetGame() {
    obs = [];
    p.l = 1;
    p.respawn = true;
    p.tx = cvs.width/2 - 40;
    p.x = p.tx;
}

function init() {
    cvs.width = window.innerWidth; 
    cvs.height = window.innerHeight;
    resetGame();
    loop();
}

// Обработка и нажатий мыши, и касаний
function handleInput(x, y) {
    if (st === 'MENU') { 
        if (y < cvs.height/2) { 
            resetGame();
            st = 'GAME'; 
        } 
        else st = 'STORE'; 
    }
    else if (st === 'STORE') {
        if (y > cvs.height-80) st = 'MENU';
        SKINS.forEach((s, i) => {
            let bY = 100 + i * 80;
            if (y > bY && y < bY + 60) {
                if (unlocked.includes(s.n)) { currentSkin = s.n; }
                else if (coins >= s.p) { coins -= s.p; unlocked.push(s.n); currentSkin = s.n; }
            }
        });
    }
    else if (st === 'GAME') {
        if (x < cvs.width/2) { if (p.l > 0) p.l--; } else { if (p.l < 2) p.l++; }
        p.tx = (cvs.width/3)*p.l + cvs.width/6 - 40;
    }
    else if (st === 'OVER') st = 'MENU';
}

window.addEventListener('touchstart', e => {
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
}, {passive: false});

window.addEventListener('mousedown', e => {
    handleInput(e.clientX, e.clientY);
});

function loop() {
    ctx.fillStyle = '#222'; 
    ctx.fillRect(0,0,cvs.width,cvs.height);
    
    if (st === 'MENU') {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = 'bold 30px Arial';
        ctx.fillText("В ПУТЬ", cvs.width/2, cvs.height/3);
        ctx.fillText("МАГАЗИН", cvs.width/2, cvs.height/1.5);
    } else if (st === 'STORE') {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = '20px Arial';
        ctx.fillText("БАЛАНС: " + coins, cvs.width/2, 60);
        SKINS.forEach((s, i) => {
            ctx.fillStyle = currentSkin === s.n ? '#1dd1a1' : (unlocked.includes(s.n) ? '#54a0ff' : '#ee5253');
            ctx.fillRect(20, 100 + i * 80, cvs.width-40, 60);
            ctx.fillStyle = 'white';
            ctx.fillText(s.n + " (" + (unlocked.includes(s.n) ? 'ВЫБРАТЬ' : s.p) + ")", cvs.width/2, 140 + i * 80);
        });
        ctx.fillText("НАЗАД", cvs.width/2, cvs.height-40);
    } else if (st === 'GAME') {
        roadY = (roadY + 12) % 60;
        ctx.strokeStyle = '#444';
        for(let i=-60; i<cvs.height; i+=60) {
            ctx.beginPath(); ctx.moveTo(cvs.width/3, i+roadY); ctx.lineTo(cvs.width/3, i+roadY+30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cvs.width*2/3, i+roadY); ctx.lineTo(cvs.width*2/3, i+roadY+30); ctx.stroke();
        }

        let d = p.tx - p.x; p.x += d * 0.12;
        p.tilt = d * 0.04;

        ctx.save();
        ctx.translate(p.x + 40, cvs.height-180);
        ctx.rotate(p.tilt);
        let skinColor = SKINS.find(s => s.n === currentSkin).c;
        ctx.fillStyle = skinColor;
        ctx.fillRect(-30, 0, 60, 100); 
        ctx.fillStyle = '#111';
        ctx.fillRect(-45, 10, 90, 15);
        ctx.restore();

        if (Math.random() < 0.03) obs.push({ l: Math.floor(Math.random()*3), y: -50, t: Math.random()>0.3?'c':'s' });
        
        for (let i = obs.length - 1; i >= 0; i--) {
            let o = obs[i];
            o.y += 10; 
            let ox = (cvs.width/3)*o.l + cvs.width/6 - 25;
            
            ctx.fillStyle = o.t === 'c' ? '#f1c40f' : '#e74c3c';
            if(o.t === 'c') { 
                ctx.beginPath(); ctx.arc(ox+25, o.y+25, 20, 0, Math.PI*2); ctx.fill(); 
            } else { 
                ctx.fillRect(ox, o.y, 50, 50); 
            }
            
            // Коллизии
            if (o.y > cvs.height-220 && o.y < cvs.height-100 && o.l === p.l) {
                if (o.t === 's') {
                    st = 'OVER';
                } else {
                    coins += 10;
                    obs.splice(i, 1);
                }
            }
            if (o.y > cvs.height) obs.splice(i, 1);
        }

        ctx.fillStyle = 'white'; ctx.textAlign = 'left'; ctx.font = '20px Arial';
        ctx.fillText("Монеты: " + coins, 20, 40);

    } else if (st === 'OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0,0,cvs.width,cvs.height);
        ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = '30px Arial';
        ctx.fillText("ИГРА ОКОНЧЕНА", cvs.width/2, cvs.height/2);
        ctx.font = '20px Arial';
        ctx.fillText("Нажми, чтобы выйти", cvs.width/2, cvs.height/2 + 50);
    }
    requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;
});

init();
</script>
</body>
</html>
