<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Moto Fix</title>
    <style>
        body { margin:0; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
        canvas { display:block; image-rendering: pixelated; max-width:100%; max-height:100%; }
        #l { color:#fff; font-size:20px; position:absolute; }
    </style>
</head>
<body>
    <div id="l">ЗАГРУЗКА...</div>
    <canvas id="c" style="display:none"></canvas>
<script>
const IMGS = {
    r1: '1000197295.png', ui: '1000197294.png',
    s1: '1000197290.png', s2: '1000197293.png',
    s3: '1000197291.png', s4: '1000197292.png'
};

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const loader = document.getElementById('l');

let assets = {}, loaded = 0, total = Object.keys(IMGS).length;
let st = 'MENU', coins = 5000, curS = 's1', unlocked = ['s1'];
let roadY = 0, obs = [], p = { l:1, x:0, tx:0 };

const SK = [
    { id:'s1', n:'РЫЖИЙ', p:0 }, { id:'s2', n:'МИЛАШКА', p:2200 },
    { id:'s3', n:'КОСМО', p:10000 }, { id:'s4', n:'ХЕЛЛОУИН', p:25000 }
];

// Авто-определение пути
const path = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

function init() {
    cvs.width = 360; cvs.height = 640; // Фиксируем размер для стабильности
    
    // Предохранитель: если за 5 сек не загрузилось - пускаем так
    setTimeout(() => { if(loaded < total) start(); }, 5000);

    for(let k in IMGS) {
        assets[k] = new Image();
        assets[k].src = path + IMGS[k];
        assets[k].onload = () => { 
            loaded++; 
            loader.innerText = "ЗАГРУЗКА: " + Math.floor((loaded/total)*100) + "%";
            if(loaded === total) start(); 
        };
        assets[k].onerror = () => {
            console.error("Не нашел: " + IMGS[k]);
            loaded++; // Считаем загруженным, чтобы не вешать игру
            if(loaded === total) start();
        };
    }
}

function start() {
    loader.style.display = 'none';
    cvs.style.display = 'block';
    p.x = cvs.width/2 - 50; p.tx = p.x;
    loop();
}

// Управление тапами
window.addEventListener('touchstart', e => {
    const rect = cvs.getBoundingClientRect();
    const x = (e.touches[0].clientX - rect.left) * (cvs.width / rect.width);
    const y = (e.touches[0].clientY - rect.top) * (cvs.height / rect.height);
    
    if(st === 'MENU') {
        if(y > 250 && y < 330) st = 'GAME';
        if(y > 350 && y < 430) st = 'STORE';
    } else if(st === 'STORE') {
        if(y > 550) st = 'MENU';
        SK.forEach((s, i) => {
            if(y > 100+i*60 && y < 150+i*60) {
                if(unlocked.includes(s.id)) curS = s.id;
                else if(coins >= s.p) { coins -= s.p; unlocked.push(s.id); curS = s.id; }
            }
        });
    } else if(st === 'GAME') {
        if(x < cvs.width/2) { if(p.l > 0) p.l--; } else { if(p.l < 2) p.l++; }
        p.tx = (cvs.width/3)*p.l + cvs.width/6 - 50;
    } else if(st === 'OVER') st = 'MENU';
});

function drawBtn(tx, ty, sx, sy) {
    if(assets.ui.complete) ctx.drawImage(assets.ui, sx, sy, 230, 90, tx, ty, 180, 70);
}

function loop() {
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,cvs.width,cvs.height);
    
    roadY = (roadY + 10) % cvs.height;
    if(assets.r1.complete) {
        ctx.drawImage(assets.r1, 0, roadY, cvs.width, cvs.height);
        ctx.drawImage(assets.r1, 0, roadY - cvs.height, cvs.width, cvs.height);
    }

    if(st === 'MENU') {
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,cvs.width,cvs.height);
        drawBtn(cvs.width/2-90, 250, 0, 0); // PLAY
        drawBtn(cvs.width/2-90, 350, 480, 0); // STORE
    } 
    
    else if(st === 'GAME') {
        let d = p.tx - p.x; p.x += d * 0.2;
        let f = Math.abs(d) < 5 ? 0 : (d < 0 ? 1 : 2);
        let img = assets[curS];
        if(img.complete) {
            let sw = img.width/3;
            ctx.drawImage(img, f*sw, 0, sw, img.height, p.x, cvs.height-180, 100, 100);
        }

        if(Math.random() < 0.02) obs.push({ l: Math.floor(Math.random()*3), y: -50, t: Math.random() > 0.3 ? 'c' : 's' });
        obs.forEach((o, i) => {
            o.y += 10;
            let ox = (cvs.width/3)*o.l + cvs.width/6 - 30;
            if(o.t === 'c') ctx.drawImage(assets.ui, 70, 745, 115, 115, ox, o.y, 60, 60);
            else ctx.drawImage(assets.ui, 495, 755, 140, 110, ox, o.y, 70, 55);
            
            if(o.y > cvs.height-160 && o.y < cvs.height-100 && o.l === p.l) {
                if(o.t === 's') st = 'OVER'; else { coins += 100; obs.splice(i,1); }
            }
            if(o.y > cvs.height) obs.splice(i,1);
        });

        ctx.fillStyle = "white"; ctx.font = "20px Arial"; ctx.fillText("Coins: " + coins, 20, 40);
    } 
    
    else if(st === 'STORE') {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,cvs.width,cvs.height);
        SK.forEach((s, i) => {
            ctx.fillStyle = curS === s.id ? "#4CAF50" : (unlocked.includes(s.id) ? "#2196F3" : "#555");
            ctx.fillRect(20, 100+i*60, cvs.width-40, 50);
            ctx.fillStyle = "#fff"; ctx.font = "16px Arial"; ctx.textAlign="center";
            ctx.fillText(s.n + (unlocked.includes(s.id) ? "" : " - " + s.p), cvs.width/2, 130+i*60);
        });
        ctx.fillText("НАЗАД", cvs.width/2, 600);
    }

    else if(st === 'OVER') {
        ctx.fillStyle = "#fff"; ctx.textAlign="center"; ctx.fillText("КОНЕЦ! ТАПНИ ДЛЯ МЕНЮ", cvs.width/2, cvs.height/2);
    }

    requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
